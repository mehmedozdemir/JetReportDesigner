name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore JetReportDesigner.slnx

      - name: Build
        run: dotnet build JetReportDesigner.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test JetReportDesigner.slnx --configuration Release --no-build --verbosity normal

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Restore
        run: dotnet restore JetReportDesigner.slnx

      - name: Verify SQL Server migrations wiring
        run: >
          dotnet ef migrations list
          --project src/JetReportDesigner.Storage.Migrations.SqlServer
          --startup-project src/JetReportDesigner.Api
          --no-connect
        env:
          Storage__Provider: SqlServer
          Storage__ConnectionString: "Server=unused;Database=unused;User Id=sa;Password=unused;TrustServerCertificate=True"

      - name: Verify PostgreSQL migrations wiring
        run: >
          dotnet ef migrations list
          --project src/JetReportDesigner.Storage.Migrations.PostgreSql
          --startup-project src/JetReportDesigner.Api
          --no-connect
        env:
          Storage__Provider: PostgreSql
          Storage__ConnectionString: "Host=unused;Database=unused;Username=unused;Password=unused"

      - name: Verify Oracle migrations wiring
        run: >
          dotnet ef migrations list
          --project src/JetReportDesigner.Storage.Migrations.Oracle
          --startup-project src/JetReportDesigner.Api
          --no-connect
        env:
          Storage__Provider: Oracle
          Storage__ConnectionString: "User Id=unused;Password=unused;Data Source=unused:1521/FREEPDB1"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build
